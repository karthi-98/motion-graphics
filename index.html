<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Bot — Fan Concept Reveal</title>
<meta name="description" content="A 60-second fan-concept product reveal for “Claude Bot”. Visuals are HTML/SVG; all music and sound are synthesized live in the browser with Tone.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --orange:#D77757;--shade:#B85F42;--ink-orange:#C0603F;--cream:#F5F0E8;--charcoal:#1F1E1D;--sand:#E8DCCB;--sage:#7FA57A;
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0c0b;overflow:hidden}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-family:var(--sans)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--cream);contain:strict}
#svg{position:absolute;left:0;top:0;display:block}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}
.sans{font-family:var(--sans)}
.card{fill:#FFFCF7;stroke:#1F1E1D;stroke-width:2}
.ln{fill:none;stroke:#1F1E1D;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:none;stroke:#1B1A18;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.cube{fill:none;stroke:#D77757;stroke-width:2.5;stroke-linecap:round}
.wm{font-family:var(--serif);font-size:176px;font-weight:600;letter-spacing:-3px}
.wmS{fill:none;stroke:#1F1E1D;stroke-width:2.2;stroke-dasharray:1000 1000;stroke-linejoin:round}
.wmS .bot{stroke:#D77757}
.wmF{fill:#1F1E1D}
.wmF .bot{fill:#D77757}
.bot{font-style:italic}
.cap{position:absolute;left:0;width:1920px;text-align:center;white-space:nowrap;font-family:var(--serif);font-size:60px;line-height:66px;font-weight:420;letter-spacing:-.01em;color:var(--charcoal);display:none}
.cap .w{display:inline-block;opacity:0;will-change:transform,opacity}
.cap .em{font-style:italic;color:var(--ink-orange)}
.cap.sub{font-size:44px;line-height:50px;color:rgba(31,30,29,.86)}
.cap.fine{font-family:var(--mono);font-size:17px;line-height:22px;letter-spacing:.06em;color:rgba(31,30,29,.55)}
#grain{mix-blend-mode:overlay;opacity:.07;background-size:220px 220px}
#vig{background:radial-gradient(ellipse at 50% 45%,rgba(24,22,20,0) 40%,rgba(24,22,20,.62) 100%);opacity:0}
#softvig{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 62%,rgba(70,45,30,.07) 100%)}
#black{background:#000;opacity:0}
#start{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;background:rgba(18,17,16,.4);pointer-events:auto;transition:opacity .4s ease}
#start.hide{opacity:0;pointer-events:none}
.btn{font:inherit;cursor:pointer;border:0;display:inline-flex;align-items:center;gap:22px;border-radius:999px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s,opacity .3s}
#playBtn{background:var(--orange);color:#fff;font-family:var(--serif);font-size:56px;font-weight:500;padding:30px 66px 30px 54px;box-shadow:0 18px 50px rgba(215,119,87,.32),inset 0 -6px 0 rgba(0,0,0,.12)}
#playBtn svg{width:46px;height:46px;fill:#fff}
#playBtn:hover:not(:disabled){transform:scale(1.05)}
#playBtn:disabled{opacity:.55;cursor:progress}
#playBtn:focus-visible,#replayBtn:focus-visible{outline:4px solid var(--sand);outline-offset:6px}
.hint{font-family:var(--mono);font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,240,232,.62)}
#replayBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:transparent;color:var(--cream);border:2px solid rgba(245,240,232,.5);font-family:var(--mono);font-size:26px;letter-spacing:.08em;padding:18px 38px;opacity:0;pointer-events:none;transition:opacity .5s ease,background .2s,transform .25s}
#replayBtn.show{opacity:1;pointer-events:auto}
#replayBtn:hover{background:rgba(245,240,232,.08);transform:translate(-50%,-50%) scale(1.04)}

<script>
(() => {
'use strict';

/* =====================================================================
   Timing — everything is authored in BEATS (110 BPM → 6/11 s per beat).
   Scene cuts land on beats: 0 · 12 · 24 · 36 · 52 · 64 · 77 · 92 · 110
   (= 0s · 6.5s · 13.1s · 19.6s · 28.4s · 34.9s · 42.0s · 50.2s · 60.0s;
    the Scene 1→2 circle wipe starts exactly at 6.0s = beat 11).
   The same beat numbers drive the visuals AND schedule the music/SFX.
   ===================================================================== */
const BPM = 110, SPB = 60 / BPM, END = 110;
const C = {orange: '#D77757', shade: '#B85F42', deep: '#C0603F', cream: '#F5F0E8', charcoal: '#1F1E1D', sand: '#E8DCCB',
  sage: '#7FA57A', paper: '#FFFCF7', ink: '#1B1A18', mustard: '#E2B04A'};

/* ---------- math & easing ---------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (b, b0, b1) => clamp((b - b0) / (b1 - b0));
const Ez = {
  lin: x => x,
  inQ: x => x * x,
  outQ: x => 1 - (1 - x) * (1 - x),
  ioQ: x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,
  inC: x => x * x * x,
  outC: x => 1 - Math.pow(1 - x, 3),
  ioC: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQt: x => 1 - Math.pow(1 - x, 4),
  ioS: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outBackS: x => { const c1 = 1.05, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const tw = (b, b0, b1, v0, v1, e = Ez.ioC) => lerp(v0, v1, e(P(b, b0, b1)));
function K(b, keys) {
  if (b <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const k = keys[i];
    if (b < k[0]) { const p = keys[i - 1]; return lerp(p[1], k[1], (k[2] || Ez.ioC)((b - p[0]) / (k[0] - p[0]))); }
  }
  return keys[keys.length - 1][1];
}
const bump = q => Math.sin(Math.PI * clamp(q));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(t)))).join(',')})`; };

/* ---------- SVG helpers (attribute writes are cached) ---------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const defs = $('defs'), world = $('world'), overlay = $('overlay');
function S(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;
function sa(e, k, v) { const c = e.__a || (e.__a = {}); if (c[k] !== v) { c[k] = v; e.setAttribute(k, v); } }
function tf(e, x, y, s = 1, r = 0) { sa(e, 'transform', `translate(${r2(x)},${r2(y)})` + (r ? `rotate(${r2(r)})` : '') + (s !== 1 ? `scale(${r3(s)})` : '')); }
function tfs(e, x, y, sx, sy, r = 0) { sa(e, 'transform', `translate(${r2(x)},${r2(y)})` + (r ? `rotate(${r2(r)})` : '') + `scale(${r3(sx)},${r3(sy)})`); }
function piv(e, px, py, sx, sy = sx, r = 0, dx = 0, dy = 0) {
  sa(e, 'transform', `translate(${r2(px + dx)},${r2(py + dy)})` + (r ? `rotate(${r2(r)})` : '') + `scale(${r3(sx)},${r3(sy)})translate(${-px},${-py})`);
}
function op(e, v) { v = v <= .002 ? 0 : v >= .998 ? 1 : r3(v); sa(e, 'opacity', v); sa(e, 'display', v === 0 ? 'none' : 'inline'); }
function popAt(e, b, t, ax, ay, dur = .45) { const q = P(b, t, t + dur); piv(e, ax, ay, Math.max(.001, Ez.outBack(q))); op(e, q > 0 ? 1 : 0); return q; }

/* ---------- score (music + sfx) event list, filled by scenes & composer ---------- */
const SCORE = [];
const ev = (b, i, o) => { SCORE.push(Object.assign({b, i}, o || {})); };
const seen = new Set();
const sfx1 = (b, i, o) => { const k = i + '@' + b.toFixed(3); if (!seen.has(k)) { seen.add(k); ev(b, i, o); } };

/* =====================================================================
   CLAWD — one rig, reused everywhere so it always looks identical.
   Local origin = ground point under the feet; body 240×168, arms 30×38,
   four 30px legs, chevron eyes. Squash/stretch pivots at the feet.
   ===================================================================== */
const LEG_X = [-84, -28, 28, 84];
const EYE = {
  happy:   ['M-9 -15L9 0L-9 15', 'M9 -15L-9 0L9 15'],   // >  <
  curious: ['M0 0L0 .01', 'M0 0L0 .01'],                // •  •
  think:   ['M-13 0L13 0', 'M-13 0L13 0'],              // -  -
  proud:   ['M-13 8L0 -7L13 8', 'M-13 8L0 -7L13 8'],     // ^  ^
  wink:    ['M-9 -15L9 0L-9 15', 'M-13 0L13 0'],         // >  -
};
function eyeState(b, track, blinks) {
  let idx = 0;
  for (let i = 0; i < track.length; i++) if (b >= track[i][0]) idx = i;
  const st = track[idx][1], TR = .14;
  let sY = 1;
  if (idx > 0 && b - track[idx][0] < TR) sY = Math.min(sY, .1 + .9 * (b - track[idx][0]) / TR);
  const nx = track[idx + 1];
  if (nx && nx[0] - b < TR) sY = Math.min(sY, .1 + .9 * (nx[0] - b) / TR);
  for (const t of blinks) { if (t > b) break; if (b < t + .26) { sY = Math.min(sY, 1 - .9 * Math.sin(Math.PI * (b - t) / .26)); break; } }
  return [st, sY];
}
/* hops: [takeoff, land, height, anticipation?]   walks: [start, end, stepBeats?, tapVolume?] */
function motion(b, spec) {
  let h = 0, sx = 1, sy = 1, bob = 0, rot = 0, legs = [0, 0, 0, 0];
  const W = spec.walks;
  if (W) for (const w of W) {
    const w0 = w[0], w1 = w[1], sd = w[2] || .5;
    if (b < w0 || b >= w1) continue;
    const ph = (b - w0) / sd, k = Math.floor(ph), fr = ph - k, sn = Math.sin(fr * Math.PI), lift = sn * 11;
    legs = (k & 1) ? [0, lift, 0, lift] : [lift, 0, lift, 0];
    bob = sn * 4; rot = ((k & 1) ? -1 : 1) * sn * 1.8;
  }
  const HP = spec.hops;
  if (HP) for (let i = 0; i < HP.length; i++) {
    const hp = HP[i], t0 = hp[0], t1 = hp[1], H = hp[2], ant = hp[3] ?? .25, nx = HP[i + 1];
    const landEnd = Math.min(t1 + .7, nx ? nx[0] - (nx[3] ?? .25) : 1e9);
    if (b < t0 - ant || b >= landEnd) continue;
    if (b < t0) { const q = Ez.outQ((b - (t0 - ant)) / ant); sy *= 1 - .14 * q; sx *= 1 + .1 * q; }
    else if (b < t1) {
      const q = (b - t0) / (t1 - t0), st = Math.pow(Math.abs(1 - 2 * q), 2), bl = ant > 0 ? Math.min(1, q / .1) : 1;
      h += H * 4 * q * (1 - q);
      sy *= lerp(.86, 1 + .14 * st, bl); sx *= lerp(1.1, 1 - .08 * st, bl);
      const tuck = Math.sin(Math.PI * q) * 7; for (let j = 0; j < 4; j++) legs[j] += tuck;
    } else {
      const q = (b - t1) / .7, d = Math.exp(-5 * q) * Math.cos(q * Math.PI * 2.4);
      sy *= 1 - .17 * d; sx *= 1 + .11 * d;
    }
  }
  return {h, sx, sy, legs, bob, rot};
}
function computePose(b, o) {
  const spec = o.spec || {}, m = motion(b, spec);
  return {
    b, x: o.x, y: o.y, s: o.s ?? 1, o: o.op ?? 1,
    h: m.h + (o.h || 0), sx: m.sx * (o.sx || 1), sy: m.sy * (o.sy || 1), legs: m.legs, bob: m.bob, rot: m.rot + (o.rot || 0),
    eyes: spec.eyes || [[-1e9, 'happy']], look: o.look || [0, 0],
    aL: o.aL || 0, aR: o.aR || 0, rL: o.rL || 1, rR: o.rR || 1,
    br: 1 + .015 * (1 - Math.cos(Math.PI * 2 * b / 4)),       // idle breathing 1 → 1.03 (one bar)
  };
}
function worldOf(p, lx, ly) {
  let x = lx, y = (ly + 34) * p.br - 34 - (p.bob || 0);
  x *= p.sx; y *= p.sy;
  if (p.rot) { const a = p.rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); const nx = x * c - y * s; y = x * s + y * c; x = nx; }
  y -= p.h;
  return [p.x + x * p.s, p.y + y * p.s];
}
const armT = (px, py, a, r) => `translate(${px},${py})rotate(${r2(a)})scale(${r3(r)},1)translate(${-px},${-py})`;
const armTip = (side, a, r) => { const rad = a * Math.PI / 180, L = 30 * r; return side < 0 ? [-120 - L * Math.cos(rad), -118 - L * Math.sin(rad)] : [120 + L * Math.cos(rad), -118 - L * Math.sin(rad)]; };
class Clawd {
  constructor(parent, seed = 1) {
    this.g = S('g', {class: 'clawd'}, parent);
    this.shadow = S('ellipse', {cx: 0, cy: 2, rx: 126, ry: 17, fill: 'url(#gShadow)'}, this.g);
    this.hopG = S('g', null, this.g);
    this.sq = S('g', null, this.hopG);
    this.back = S('g', null, this.sq);
    this.legs = LEG_X.map(x => S('use', {href: '#clawdLeg', transform: `translate(${x},0)`}, this.sq));
    this.up = S('g', null, this.sq);
    this.armL = S('g', null, this.up); S('use', {href: '#clawdArmL'}, this.armL);
    this.armR = S('g', null, this.up); S('use', {href: '#clawdArmR'}, this.armR);
    this.body = S('use', {href: '#clawdBody'}, this.up);
    this.face = S('g', null, this.up);
    this.eyes = [S('path', {class: 'eye'}, this.face), S('path', {class: 'eye'}, this.face)];
    this.front = S('g', null, this.up);
    const R = rng(seed * 7919 + 13);
    this.blinks = []; for (let t = .9 + R() * 2.5; t < 130; t += 3.4 + R() * 3.4) this.blinks.push(t);
    this.p = null;
  }
  apply(p) {
    this.p = p;
    op(this.g, p.o); if (p.o <= .002) return;
    tf(this.g, p.x, p.y, p.s);
    const h = Math.max(0, p.h), k = Math.min(1, h / 240);
